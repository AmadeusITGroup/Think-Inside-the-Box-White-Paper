<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Vibrant gradient spanning from the left (AI/Code Blue) to the right (Docs Orange) -->
    <linearGradient id="geo-cube-grad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00b4db" />
      <stop offset="35%" stop-color="#0083b0" />
      <stop offset="70%" stop-color="#e65c00" />
      <stop offset="100%" stop-color="#f9d423" />
    </linearGradient>
    
    <!-- Subtle glow filter to mimic the original aesthetic -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Styled Geometry Group -->
  <g fill="none" stroke="url(#geo-cube-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtle-glow)">
    <!-- Outer Hexagon Boundary -->
    <polygon points="200,50 330,125 330,275 200,350 70,275 70,125" />
    
    <!-- Central Axis Lines (Isometric Cube Depth) -->
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="70" y1="125" x2="330" y2="275" />
    <line x1="70" y1="275" x2="330" y2="125" />
    
    <!-- Inner Intersecting Facets (The "Thinking Inside" Structure) -->
    <polygon points="200,150 286,200 200,250 114,200" stroke-width="2" opacity="0.9" />
    <polygon points="200,50 286,200 200,350 114,200" stroke-width="1.5" opacity="0.7" />
    
    <!-- Additional Geometric Cross-Tethers -->
    <line x1="200" y1="150" x2="200" y2="50" stroke-width="2" />
    <line x1="200" y1="250" x2="200" y2="350" stroke-width="2" />
    <line x1="114" y1="200" x2="70" y2="125" stroke-width="1.5" />
    <line x1="286" y1="200" x2="330" y2="275" stroke-width="1.5" />
    <line x1="114" y1="200" x2="70" y2="275" stroke-width="1.5" />
    <line x1="286" y1="200" x2="330" y2="125" stroke-width="1.5" />
  </g>
</svg>